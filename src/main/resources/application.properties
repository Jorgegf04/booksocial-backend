spring.application.name=booksocial-backend

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=9999
spring.thymeleaf.cache=false


# ===============================
# DATABASE - Elige solo una seccion
# ===============================

# --- DESARROLLO: H2 (comentar si usas MySQL) ---
# spring.datasource.url=jdbc:h2:file:C:/Users/jgfes/booksocial-data/booksocial
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# --- PRODUCCION: MySQL / XAMPP / Workbench (descomentar si usas MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/booksocial?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false


# ===============================x
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# HIKARI - Fail-fast si MySQL no está disponible al arrancar
# ===============================
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=5000

# ===============================
# MAIL (Gmail SMTP)
# Pasos: Gmail → Cuenta → Seguridad → Contraseñas de aplicación (requiere 2FA).
# Establece MAIL_USERNAME y MAIL_PASSWORD como variables de entorno.
# ===============================
# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:uploads}
upload.base-url=${BACKEND_URL:http://localhost:9999}

# ===============================
# MAIL (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
